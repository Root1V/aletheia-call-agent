[project]
name = "cea-asr"
version = "0.1.0"
description = "Reconocimiento de voz en streaming para el copiloto"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "sherpa-onnx>=1.13",
    # La librería nativa (libonnxruntime) viaja en este paquete separado, y esa
    # dependencia sólo aparece en los metadatos del WHEEL de sherpa-onnx. Si la
    # resolución usa el sdist del padre —cosa que hace en cuanto alguna
    # plataforma del universo no tiene rueda— el core desaparece y sherpa-onnx
    # importa pero falla al cargar el .dylib. Declararlo aquí lo vuelve
    # innegociable.
    "sherpa-onnx-core>=1.13",
    # audioop salió de la biblioteca estándar en Python 3.13. El backport
    # mantiene el mismo nombre de módulo, así que el código no cambia según la
    # versión; sin esta línea, la degradación a telefonía —y con ella toda la
    # evaluación— revienta al subir a 3.13.
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_asr"]
