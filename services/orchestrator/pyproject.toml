[project]
name = "cea-orchestrator"
version = "0.1.0"
description = "Decide qué sugerir y cuándo, y lo publica en el bus de la llamada."
requires-python = ">=3.12"
dependencies = [
    "cea-contracts",
    "cea-bus",
    "cea-copilot",
    "cea-rag",
    "cea-llm",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
]

[project.scripts]
cea-orchestrator = "cea_orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_orchestrator"]
