[project]
name = "cea-redaction"
version = "0.1.0"
description = "Redacción de datos sensibles en transcripciones de llamadas"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_redaction"]
