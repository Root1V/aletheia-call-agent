[project]
name = "cea-emotion"
version = "0.1.0"
description = "Estado emocional del cliente a partir de señales prosódicas y conversacionales"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_emotion"]
