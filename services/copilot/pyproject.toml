[project]
name = "cea-copilot"
version = "0.1.0"
description = "Sugerencia de respuesta con citación obligatoria y verificación de cifras"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
    "cea-llm",
    "cea-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_copilot"]
