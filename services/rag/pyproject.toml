[project]
name = "cea-rag"
version = "0.1.0"
description = "Búsqueda híbrida sobre la base de conocimiento del banco"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
    "cea-llm",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_rag"]
