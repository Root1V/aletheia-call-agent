[project]
name = "cea-reclamos"
version = "0.1.0"
description = "Clasificación reclamo/requerimiento bajo la Ley 31763, y el reloj del plazo."
requires-python = ">=3.12"
dependencies = ["cea-contracts", "cea-llm", "cea-rag", "cea-copilot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_reclamos"]
