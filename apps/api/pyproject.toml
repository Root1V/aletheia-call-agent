[project]
name = "cea-api"
version = "0.1.0"
description = "API y WebSocket gateway del workspace del ejecutivo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
    "cea-synthetic",
    "cea-bus",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 lee bcrypt.__about__.__version__, atributo que bcrypt
    # eliminó en 4.1. Sin este tope el login revienta al arrancar con un
    # AttributeError poco obvio (pyca/bcrypt#684).
    "bcrypt<4.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
