[project]
name = "customer-executive-assistant"
version = "0.1.0"
description = "Copiloto de atención al cliente bancario en tiempo real — open source"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = []

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/synthetic-data",
    "packages/eventbus",
    "apps/api",
    "apps/agent-worker",
    "services/asr",
    "services/emotion",
    "services/redaction",
]

[tool.uv]
# Nunca construir sherpa-onnx desde su sdist.
#
# La librería nativa (libonnxruntime.dylib) viaja en el paquete separado
# `sherpa-onnx-core`, y esa dependencia sólo aparece en los metadatos del
# WHEEL. Como `sherpa-onnx-core` no publica sdist, la resolución universal de
# uv —que contempla todas las plataformas— retrocede al sdist del padre, lo
# construye sin el core, y el resultado importa pero revienta al cargar la
# librería nativa. Prohibirlo convierte ese fallo silencioso en un error de
# instalación claro.
no-build-package = ["sherpa-onnx"]

# Plataformas para las que se resuelve el lockfile.
#
# Por defecto uv resuelve para TODAS las plataformas imaginables, y si una
# dependencia nativa no tiene rueda para alguna de ellas, retrocede al sdist
# del padre para todo el mundo. Declarar el universo real —Apple Silicon en
# desarrollo, Linux en servidor— permite usar las ruedas nativas. Añadir una
# plataforma nueva aquí es una decisión consciente, no un descubrimiento en
# mitad de un despliegue.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
cea-contracts = { workspace = true }
cea-synthetic = { workspace = true }
cea-asr = { workspace = true }
cea-bus = { workspace = true }
cea-emotion = { workspace = true }
cea-redaction = { workspace = true }
cea-agent-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Sin esto, apps/api/tests y services/asr/tests colisionan: ambos se
# resolverían como el módulo "tests" y pytest aborta la recolección.
addopts = "--import-mode=importlib"
testpaths = ["packages", "apps", "services", "evals"]
filterwarnings = ["ignore::DeprecationWarning"]
