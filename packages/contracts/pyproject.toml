[project]
name = "cea-contracts"
version = "0.1.0"
description = "Esquemas de eventos y dominio compartidos por todos los servicios del copiloto"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_contracts"]
