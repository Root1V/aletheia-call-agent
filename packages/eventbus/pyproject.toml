[project]
name = "cea-bus"
version = "0.1.0"
description = "Bus de eventos de la llamada sobre Redis Streams"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "cea-contracts",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cea_bus"]
